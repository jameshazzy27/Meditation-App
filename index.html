<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="theme-color" content="#f8f7f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1d21" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aura" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="A calm journal for runs, kettlebell workouts, mood and meditation." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aura</title>
    <script>
      // Apply the saved light/dark choice before the page draws, so it never flashes.
      // Kept in sync with src/lib/theme.ts.
      ;(() => {
        let saved = null
        try { saved = localStorage.getItem('aura-theme') } catch {}
        const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
